spring.application.name=hr-stack

# =========================
# Database
# =========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================
# Flyway
# =========================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# =========================
# Server
# =========================
server.port=${PORT:8080}


# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


# =========================
# MinIO
# =========================
#minio.endpoint=${MINIO_ENDPOINT}
#minio.access-key=${MINIO_ACCESS_KEY}
#minio.secret-key=${MINIO_SECRET_KEY}
#minio.temp-bucket=${MINIO_TEMP_BUCKET}
#minio.permanent-bucket=${MINIO_PERMANENT_BUCKET}
#minio.region=${MINIO_REGION}

#s3
s3.endpoint=${S3_ENDPOINT}
s3.access-key=${S3_ACCESS_KEY}
s3.secret-key=${S3_SECRET_KEY}
s3.region=${S3_REGION}
s3.temp-bucket=${S3_TEMP_BUCKET}
s3.permanent-bucket=${S3_PERMANENT_BUCKET}

salary-slip.replacement-window-months=2
salary-slip.storage-window-hours=12


#Gmail SMTP config
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# Frontend URL
# =========================
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

