<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:40px 15px;background:#f1f5f9;font-family:Arial,sans-serif;">
<table align="center" width="600" cellpadding="0" cellspacing="0"
       style="max-width:600px;width:100%;background:#fff;border-radius:14px;overflow:hidden;">
    <tr><td style="background:#2563eb;padding:24px;text-align:center;color:#fff;font-size:26px;font-weight:bold;">
        HR-Stack</td></tr>
    <tr><td style="padding:32px;color:#475569;font-size:15px;line-height:1.6;">
        <h2 style="margin:0 0 12px;color:#1e293b;">Login Verification</h2>
        <p>Hello <strong>{{name}}</strong>,</p>
        <p>Use this OTP to finish signing in to HR-Stack:</p>
        <div style="text-align:center;background:#eff6ff;border:2px solid #bfdbfe;border-radius:10px;
                  padding:20px;color:#1d4ed8;font-size:34px;font-weight:bold;letter-spacing:10px;">
            {{otp}}</div>
        <p>This OTP is valid for 5 minutes. Do not share it with anyone.</p>
        <p>If you did not try to log in, please change your password immediately.</p>
    </td></tr>
</table>
</body>
</html>
