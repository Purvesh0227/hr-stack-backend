
name: HR-Stack Backend CI

on:
  push:
  pull_request:
    branches:
      - master
      - prod

permissions:
  contents: read

jobs:
  test:
    name: Build and Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hrstack_test
          POSTGRES_USER: hrstack_test_user
          POSTGRES_PASSWORD: ci_test_only_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U hrstack_test_user -d hrstack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/hrstack_test
      SPRING_DATASOURCE_USERNAME: hrstack_test_user
      SPRING_DATASOURCE_PASSWORD: ci_test_only_password
      S3_ENDPOINT: http://localhost:9000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        run: chmod +x mvnw && ./mvnw -B test
